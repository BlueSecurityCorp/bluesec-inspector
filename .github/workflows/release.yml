name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 0.2.2
        type: string
      target_ref:
        description: Commit, branch, or tag to release
        required: true
        default: main
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $RELEASE_VERSION"
            exit 1
          fi

      - name: Check out release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Resolve release commit
        id: release_commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify repository versions
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_ROOT_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          printf 'Requested: %s\npackage.json: %s\npackage-lock.json: %s\npackage-lock root: %s\nmanifest.json: %s\n' \
            "$RELEASE_VERSION" "$PACKAGE_VERSION" "$LOCK_VERSION" "$LOCK_ROOT_VERSION" "$MANIFEST_VERSION"

          [[ "$PACKAGE_VERSION" == "$RELEASE_VERSION" ]]
          [[ "$LOCK_VERSION" == "$RELEASE_VERSION" ]]
          [[ "$LOCK_ROOT_VERSION" == "$RELEASE_VERSION" ]]
          [[ "$MANIFEST_VERSION" == "$RELEASE_VERSION" ]]

      - name: Reject an existing release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build extension
        run: npm run build

      - name: Verify extension package
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/manifest.json
          test -f dist/service-worker.js
          test -f dist/sidepanel.html
          test -d dist/icons

          DIST_VERSION="$(node -p "require('./dist/manifest.json').version")"
          [[ "$DIST_VERSION" == "$RELEASE_VERSION" ]]

      - name: Create release archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="bluesec-inspector-$RELEASE_VERSION.zip"
          (
            cd dist
            zip -r "../$ARCHIVE" .
          )
          sha256sum "$ARCHIVE" | tee "$ARCHIVE.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluesec-inspector-${{ inputs.version }}
          path: |
            bluesec-inspector-${{ inputs.version }}.zip
            bluesec-inspector-${{ inputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          ARCHIVE="bluesec-inspector-$RELEASE_VERSION.zip"
          PRERELEASE_ARGS=()

          if [[ '${{ inputs.prerelease }}' == 'true' ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --repo '${{ github.repository }}' \
            --target "$RELEASE_SHA" \
            --title "BlueSec Inspector $RELEASE_VERSION" \
            --generate-notes \
            "${PRERELEASE_ARGS[@]}"
